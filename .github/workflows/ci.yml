name: CI

on:
  push:
    branches: [ main, report, backend ]
  pull_request:
    branches: [ main, report, backend ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install jinja2 plotly kaleido pandas pytest
          fi

      - name: Run offline test suite
        run: |
          pytest tests/ -v

      - name: Generate fresh fixture data
        run: |
          python fixtures/make_fixtures.py --output-dir data/outputs/sample

      - name: Build self-contained HTML report and leaderboard image
        run: |
          python report/build_report.py --run data/outputs/sample --output report.html --img leaderboard.png

      - name: Upload Report and Leaderboard Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: crowdpulse-visual-report
          path: |
            report.html
            leaderboard.png
          retention-days: 14
